<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="GeoPageScan — Free AI Visibility Scanner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030712"/><stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#00E5FF" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/><line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="472" x2="1200" y2="472"/>
  </g>
  <!-- logo mark -->
  <g transform="translate(80,70)">
    <path d="M40 5 68 21v38L40 75 12 59V21L40 5z" stroke="url(#g)" stroke-width="3.5" fill="rgba(0,229,255,0.05)"/>
    <circle cx="40" cy="40" r="15" stroke="url(#g)" stroke-width="3" fill="none"/>
    <circle cx="40" cy="40" r="5" fill="url(#g)"/>
  </g>
  <text x="180" y="105" font-family="Outfit, sans-serif" font-size="34" font-weight="800" fill="#f1f5f9">GeoPageScan</text>
  <text x="181" y="138" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="4" fill="#8c99b0">AI VISIBILITY SCANNER</text>

  <text x="80" y="300" font-family="Outfit, sans-serif" font-size="76" font-weight="900" fill="#f1f5f9">Is your website</text>
  <text x="80" y="392" font-family="Outfit, sans-serif" font-size="76" font-weight="900" fill="url(#g)">visible to AI?</text>

  <text x="80" y="470" font-family="Outfit, sans-serif" font-size="27" fill="#94a3b8">Free AI-visibility audit — GEO · AEO · SEO. Get cited by</text>
  <text x="80" y="506" font-family="Outfit, sans-serif" font-size="27" fill="#94a3b8">ChatGPT, Claude, Gemini and Perplexity.</text>

  <rect x="80" y="545" width="330" height="52" rx="12" fill="none" stroke="url(#g)" stroke-width="2"/>
  <text x="245" y="578" font-family="Outfit, sans-serif" font-size="22" font-weight="700" fill="#00E5FF" text-anchor="middle">Scan any site free →</text>
  <text x="1120" y="590" font-family="JetBrains Mono, monospace" font-size="20" fill="#475569" text-anchor="end">geopagescan.com</text>
